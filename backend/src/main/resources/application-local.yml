spring:
  datasource:
    url: jdbc:h2:file:./data/uniwiki-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

uniwiki:
  cors:
    allowed-origin-patterns: http://localhost:5173,http://127.0.0.1:5173
  vector-sync:
    interval-ms: 5000
    max-attempts: 100
  official-sources:
    bootstrap-enabled: true
    collect-on-startup: true
    scheduler-enabled: false
    author-id: 1
    author-email: official-source@local.invalid
    allowed-host-suffixes: sejong.ac.kr
    category-ids:
      academic: 0
      career: 0
      scholarship: 0
      campus-life: 0
    attachments:
      max-count: 10
      max-bytes: 20971520
      max-text-length: 50000
